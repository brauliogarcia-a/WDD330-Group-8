<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sleep Outside | Checkout</title>
    <link rel="stylesheet" href="/css/style.css" />
    <script type="module" src="../js/checkout.js" type="module"></script>
  </head>

  <body>
    <header class="divider" id="main-header"></header>

    <main class="divider">
      <section class="products">
        <h2>Review & Place your Order</h2>
      </section>
      <form id="checkoutForm">
        <fieldset>
          <legend>Shipping</legend>
          <label for="fname">First name:</label>
          <input type="text" id="fname" name="fname" required placeholder="First Name"><br><br>
          <label for="lname">Last name:</label>
          <input type="text" id="lname" name="lname" required placeholder="Last Name"><br><br>
          <label for="street">Street:</label>
          <input type="text" id="street" name="street" required placeholder="Street"><br><br>
          <label for="city">City:</label>
          <input type="text" id="city" name="city" required placeholder="City"><br><br>
          <label for="state">State:</label>
          <input type="text" id="state" name="state" required placeholder="State"><br><br>
          <label for="zip">zip:</label>
          <input type="number" id="zip" name="zip" required placeholder="Zip"><br><br>
        </fieldset>
        <fieldset>
          <legend>Payment</legend>
          <label for="cardNumber">Card Number:</label>
          <input type = "number" id="cardNumber" name="cardNumber" required placeholder="Card Number"><br><br>
          <label for="expiration">Expiration:</label>
          <input taype="date" id="expiration" name="expiration" required placeholder="Expiration"><br><br>
          <label for="code">Security Code:</label>
          <input type="number " id="code" name="code" required placeholder="Security Code"><br><br>
        </fieldset> 
        <fieldset>
          <legend>Order Summary</legend>
          <p>Item Subtotal: 
            <span id="itemSubtotal"></span>
          </p>
          <p>Shipping Estimate: 
            <span id="shippingEstimate"></span>
          </p>
          <p>Tax: 
            <span id="tax"></span>
          </p>
          <p>Order Total: 
            <span id="total"></span>
          </p>
        </fieldset>
        <button type="submit">Checkout</button>
      </form>
    </main>
    <footer id="main-footer"></footer>
  </body>
</html>
